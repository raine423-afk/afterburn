version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/London"
    allow:
      - dependency-name: "System.*"
      - dependency-name: "Microsoft.*"
      - dependency-name: "NexusMods.*"
      - dependency-name: "Avalonia*"
      - dependency-name: "GameFinder*"
    ignore:
      # NOTE(erri120): "special" dependencies that are tied to the roslyn compiler version
      - dependency-name: "Microsoft.CodeAnalysis*"
      # Afterburn: System.CommandLine 2.x final isn't compatible with the beta API the app uses (NamingConventionBinder).
      - dependency-name: "System.CommandLine*"
      # Afterburn targets .NET 9: newer major versions of the .NET libraries belong to newer runtimes.
      - dependency-name: "Microsoft.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "System.*"
        update-types: ["version-update:semver-major"]
    groups:
      System:
        patterns:
          - "System.*"
      Microsoft:
        patterns:
          - "Microsoft.*"
      NexusMods:
        patterns:
          - "NexusMods.*"
      Avalonia:
        patterns:
          - "Avalonia*"
      GameFinder:
        patterns:
          - "GameFinder*"
