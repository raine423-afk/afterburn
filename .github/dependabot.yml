version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/London"
    labels:
      - "area-dependencies"
    allow:
      - dependency-name: "System.*"
      - dependency-name: "Microsoft.*"
      - dependency-name: "NexusMods.*"
      - dependency-name: "Avalonia*"
      - dependency-name: "GameFinder*"
    ignore:
      # NOTE(erri120): "special" dependencies that are tied to the roslyn compiler version
      - dependency-name: "Microsoft.CodeAnalysis.CSharp*"
      - dependency-name: "System.CommandLine"
        update-types: ["version-update:semver-major"]
      - dependency-name: "System.Linq.Async"
        update-types: ["version-update:semver-major"]
      - dependency-name: "System.Reactive"
        update-types: ["version-update:semver-major"]
    groups:
      System:
        patterns:
          - "System.*"
      Microsoft:
        patterns:
          - "Microsoft.*"
      NexusMods:
        patterns:
          - "NexusMods.*"
      Avalonia:
        patterns:
          - "Avalonia*"
      GameFinder:
        patterns:
          - "GameFinder*"
