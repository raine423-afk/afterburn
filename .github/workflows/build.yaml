name: Build Afterburn

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.x'
      - name: Publish (self-contained, so users don't need to install .NET)
        run: dotnet publish src/NexusMods.App/NexusMods.App.csproj -c Release -r win-x64 --self-contained true -p:PublishReadyToRun=true -o publish
      - name: Add license files to the build
        shell: pwsh
        run: Copy-Item LICENSE.md, NOTICE.md, THIRD-PARTY-NOTICES.md, README.md publish/
      - name: Build the installer
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc installer/afterburn.iss /DAppVersion=1.0.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: Afterburn-win-x64
          path: publish/
      - uses: actions/upload-artifact@v4
        with:
          name: Afterburn-Setup
          path: installer-out/*.exe
