name: Build Afterburn

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

# Read-only by default. Only the release job (tags only) can write.
permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      # Optional code signing: add these two repository secrets (Settings -> Secrets and variables -> Actions)
      # to sign Afterburn.exe and the installer. Without them, the build still works but is unsigned.
      SIGN_PFX_BASE64: ${{ secrets.SIGN_PFX_BASE64 }}
      SIGN_PFX_PASSWORD: ${{ secrets.SIGN_PFX_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '9.x'
      - name: Publish (self-contained, so users don't need to install .NET)
        run: dotnet publish src/NexusMods.App/NexusMods.App.csproj -c Release -r win-x64 --self-contained true -p:PublishReadyToRun=true -p:PublishReadyToRunComposite=true -p:TieredPGO=false -o publish -nologo "-clp:ErrorsOnly"
      - name: Check dependencies for known vulnerabilities
        shell: pwsh
        run: |
          $out = dotnet list src/NexusMods.App/NexusMods.App.csproj package --vulnerable --include-transitive 2>&1 | Out-String
          Write-Host $out
          "## Dependency vulnerability check" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          '```' | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          $out | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          '```' | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          if ($out -match 'has the following vulnerable packages') {
            Write-Host "::warning title=Vulnerable dependencies::A NuGet package used by Afterburn has a known vulnerability. See the job summary."
          }
      - name: Sign Afterburn.exe (only if a certificate is configured)
        if: env.SIGN_PFX_BASE64 != ''
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "sign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGN_PFX_BASE64))
          try {
            $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1
            & $signtool.FullName sign /fd SHA256 /f $pfx /p $env:SIGN_PFX_PASSWORD /tr http://timestamp.digicert.com /td SHA256 publish/Afterburn.exe
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally { Remove-Item $pfx -Force -ErrorAction SilentlyContinue }
      - name: Add license files to the build
        shell: pwsh
        run: Copy-Item LICENSE.md, NOTICE.md, THIRD-PARTY-NOTICES.md, README.md publish/
      - name: List bundled NuGet packages and their licenses
        continue-on-error: true
        shell: pwsh
        run: |
          dotnet tool install --global nuget-license --version 4.0.18
          nuget-license -i src/NexusMods.App/NexusMods.App.csproj -o Markdown -fo publish/THIRD-PARTY-PACKAGES.md
      - name: Build the installer
        shell: pwsh
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --version 6.7.1 -y --no-progress
          }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          $propsVer = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          $ver = if ($env:REF_TYPE -eq 'tag') { $env:REF_NAME.TrimStart('v') } elseif ($propsVer) { $propsVer } else { '1.0.0' }
          & $iscc installer/afterburn.iss /DAppVersion=$ver
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Afterburn-win-x64
          path: publish/
      - name: Sign the installer (only if a certificate is configured)
        if: env.SIGN_PFX_BASE64 != ''
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "sign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGN_PFX_BASE64))
          try {
            $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1
            & $signtool.FullName sign /fd SHA256 /f $pfx /p $env:SIGN_PFX_PASSWORD /tr http://timestamp.digicert.com /td SHA256 (Get-ChildItem installer-out/*.exe).FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally { Remove-Item $pfx -Force -ErrorAction SilentlyContinue }
      - name: SHA-256 checksum of the installer
        shell: pwsh
        run: |
          Get-ChildItem installer-out/*.exe | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$h  $($_.Name)" | Out-File -Encoding ascii "$($_.FullName).sha256"
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Afterburn-Setup
          path: installer-out/*

  # Afterburn: Linux / Steam Deck build (self-contained, unpack and run ./Afterburn). It never blocks the Windows release.
  build-linux:
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '9.x'
      - name: Publish (self-contained)
        run: dotnet publish src/NexusMods.App/NexusMods.App.csproj -c Release -r linux-x64 --self-contained true -p:PublishReadyToRun=true -p:TieredPGO=false -p:DefineConstants=INSTALLATION_METHOD_ARCHIVE -o publish-linux -nologo "-clp:ErrorsOnly"
      - name: Use the current official 7-Zip for Linux
        # The 7zz in the repository is 21.03 (2021), which has known security bugs (CVE-2024-11477, CVE-2025-55188).
        # Replace it with the pinned official 7-Zip release from github.com/ip7z/7zip.
        env:
          SEVENZIP_VERSION: '26.06'
        run: |
          set -euo pipefail
          short="${SEVENZIP_VERSION//./}"
          curl -fsSL --proto '=https' --tlsv1.2 -o 7z.tar.xz "https://github.com/ip7z/7zip/releases/download/${SEVENZIP_VERSION}/7z${short}-linux-x64.tar.xz"
          mkdir -p 7z-new && tar -xJf 7z.tar.xz -C 7z-new 7zz
          ./7z-new/7zz > 7z-info.txt || true
          head -3 7z-info.txt | tee -a "$GITHUB_STEP_SUMMARY"
          grep -q "7-Zip (z) ${SEVENZIP_VERSION}" 7z-info.txt || { echo "::error::unexpected 7-Zip version"; exit 1; }
          sha256sum 7z.tar.xz 7z-new/7zz | tee -a "$GITHUB_STEP_SUMMARY"
          found=0
          while IFS= read -r target; do cp 7z-new/7zz "$target"; chmod +x "$target"; found=1; done < <(find publish-linux -name 7zz -type f)
          if [ "$found" = 0 ]; then echo "::error::7zz not found in the Linux build"; exit 1; fi
      - name: Package
        run: |
          cp LICENSE.md NOTICE.md THIRD-PARTY-NOTICES.md README.md publish-linux/
          if [ -f publish-linux/NexusMods.App ] && [ ! -f publish-linux/Afterburn ]; then mv publish-linux/NexusMods.App publish-linux/Afterburn; fi
          chmod +x publish-linux/Afterburn 2>/dev/null || true
          ver=$(grep -oP '(?<=<Version>)[^<]+' Directory.Build.props | head -1)
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then ver="${GITHUB_REF_NAME#v}"; fi
          mkdir -p linux-out
          tar -C publish-linux -czf "linux-out/Afterburn-${ver}-linux-x64.tar.gz" .
          (cd linux-out && sha256sum *.tar.gz > "Afterburn-${ver}-linux-x64.tar.gz.sha256")
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Afterburn-linux-x64
          path: linux-out/*

  # Publishing a release is the only step that needs write access, so it runs separately and only for tags.
  release:
    if: github.ref_type == 'tag'
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Afterburn-Setup
          path: installer-out
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: Afterburn-linux-x64
          path: installer-out
      - name: Publish the release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: |
            installer-out/*.exe
            installer-out/*.tar.gz
            installer-out/*.sha256
          body: |
            Windows installer for Afterburn ${{ github.ref_name }}, plus a Linux / Steam Deck build (unpack the .tar.gz and run ./Afterburn).
            Complete source code for this release: the "Source code" archives below, or this repository at tag ${{ github.ref_name }}. Licensed under GPL-3.0; see LICENSE.md, NOTICE.md and THIRD-PARTY-NOTICES.md.
